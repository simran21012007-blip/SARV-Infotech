<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --background: #eef2f7;
    --card: #ffffff;
    --display: #f3f5f8;
    --button: #e6e9ee;
    --text: #20242b;
    --secondary: #737984;
    --border: #dce0e6;

    --operator: #ff9500;
    --danger: #e74c3c;
    --success: #20a464;

    --shadow: rgba(0, 0, 0, 0.14);
}

body.dark {
    --background: #101114;
    --card: #1c1e23;
    --display: #111318;
    --button: #30333a;
    --text: #ffffff;
    --secondary: #a8adb7;
    --border: #34373e;

    --shadow: rgba(0, 0, 0, 0.55);
}

body {
    min-height: 100vh;
    padding: 30px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
}

.app {
    width: 400px;
    max-width: 100%;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.header h1 { font-size: 27px; }
.header p { margin-top: 5px; font-size: 12px; color: var(--secondary); }

.theme-button {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    background: var(--card);
    color: var(--text);
    box-shadow: 0 5px 15px var(--shadow);
}

.calculator {
    padding: 20px;
    border-radius: 25px;
    background: var(--card);
    box-shadow: 0 15px 35px var(--shadow);
}

.display {
    height: 110px;
    padding: 12px 15px;
    margin-bottom: 18px;
    border-radius: 17px;
    background: var(--display);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

#previousDisplay { height: 25px; text-align: right; font-size: 14px; color: var(--secondary); }

#display {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    text-align: right;
    font-size: 38px;
    font-weight: bold;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
}

.buttons button {
    height: 65px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 21px;
    font-weight: bold;
    background: var(--button);
    color: var(--text);
    transition: transform 0.15s, opacity 0.15s;
}

.buttons button:hover { opacity: 0.8; }
.buttons button:active { transform: scale(0.93); }
.buttons .operator { background: var(--operator); color: white; }
.buttons .clear { background: var(--danger); color: white; }
.buttons .delete { background: #777f8a; color: white; }
.buttons .equals { background: var(--success); color: white; }
.buttons .zero { grid-column: span 2; }

.copy-button {
    width: 100%;
    height: 45px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    background: var(--display);
    color: var(--text);
}

.copy-button:hover { opacity: 0.8; }

.history {
    margin-top: 18px;
    padding: 18px;
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 10px 25px var(--shadow);
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.history h2 { font-size: 17px; }
#calculationCount { display: block; margin-top: 4px; font-size: 12px; color: var(--secondary); }

#clearHistory {
    border: none;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    background: var(--danger);
    color: white;
}

#historyList { max-height: 150px; overflow-y: auto; }

#historyList p {
    padding: 9px 10px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: var(--display);
    font-size: 14px;
    text-align: right;
}

.empty-history { text-align: center !important; color: var(--secondary); }

.keyboard-info {
    margin-top: 15px;
    text-align: center;
    font-size: 11px;
    color: var(--secondary);
}

@media (max-width: 420px) {
    body { padding: 20px 10px; }
    .calculator { padding: 15px; }
    .buttons { gap: 8px; }
    .buttons button { height: 58px; }
    #display { font-size: 31px; }
    .header h1 { font-size: 23px; }
}

.scientific-toggle {
    width: 100%;
    height: 45px;
    margin-bottom: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    background: #6c5ce7;
    color: white;
}

.scientific-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.scientific-buttons button {
    height: 48px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    background: var(--display);
    color: var(--text);
}

.scientific-buttons button:hover { opacity: 0.75; }
.hidden { display: none; }

.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.action-buttons button {
    height: 45px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.copy-button { margin-top: 0; background: var(--display); color: var(--text); }
.paste-button { background: var(--display); color: var(--text); }
.action-buttons button:hover { opacity: 0.8; }
    </style>
</head>

<body>

    <main class="app">

        <header class="header">
            <div>
                <h1>Smart Calculator</h1>
                <p>Web Development Internship Project</p>
            </div>
            <button id="themeToggle" class="theme-button" title="Change Theme">🌙</button>
        </header>

        <section class="calculator">

            <div class="display">
                <div id="previousDisplay">Ready</div>
                <input type="text" id="display" value="0" readonly>
            </div>

            <button id="scientificToggle" class="scientific-toggle">Scientific Mode</button>

            <div id="scientificButtons" class="scientific-buttons hidden">
                 <button data-scientific="sqrt">√</button>
                 <button data-scientific="square">x²</button>
                 <button data-scientific="reciprocal">1/x</button>
                 <button data-scientific="sign">+/−</button>
                 <button data-scientific="pi">π</button>
                 <button data-scientific="sin">sin</button>
                 <button data-scientific="cos">cos</button>
                 <button data-scientific="tan">tan</button>
            </div>

            <div class="buttons">
                <button class="clear">AC</button>
                <button class="delete">DEL</button>
                <button class="operator">%</button>
                <button class="operator">÷</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">×</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">−</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>

                <button class="zero">0</button>
                <button>.</button>
                <button class="equals">=</button>
            </div>

            <div class="action-buttons">
                <button id="copyResult" class="copy-button">📋 Copy</button>
                <button id="pasteResult" class="paste-button">📥 Paste</button>
            </div>

        </section>

        <section class="history">
            <div class="history-header">
                <div>
                    <h2>Calculation History</h2>
                    <span id="calculationCount">Calculations: 0</span>
                </div>
                <button id="clearHistory">Clear</button>
            </div>

            <div id="historyList">
                <p class="empty-history">No calculations yet</p>
            </div>
        </section>

        <p class="keyboard-info">
            ⌨️ Keyboard supported • Enter = Calculate • Backspace = Delete • Esc = Clear
        </p>

    </main>

    <script>
const display = document.getElementById("display");
const previousDisplay = document.getElementById("previousDisplay");
const buttons = document.querySelectorAll(".buttons button");
const historyList = document.getElementById("historyList");
const clearHistoryButton = document.getElementById("clearHistory");
const calculationCount = document.getElementById("calculationCount");
const copyResult = document.getElementById("copyResult");
const themeToggle = document.getElementById("themeToggle");
const pasteResult = document.getElementById("pasteResult");

let calculationHistory = JSON.parse(localStorage.getItem("calculatorHistory")) || [];

buttons.forEach(function (button) {
    button.addEventListener("click", function () {
        const value = button.textContent.trim();
        if (value === "AC") { clearDisplay(); }
        else if (value === "DEL") { deleteLast(); }
        else if (value === "=") { calculate(); }
        else { appendValue(value); }
    });
});

function appendValue(value) {
    if (display.value === "Error") { display.value = "0"; }
    if (value === "×") { value = "*"; }
    else if (value === "÷") { value = "/"; }
    else if (value === "−") { value = "-"; }
    if (display.value === "0" && value !== ".") { display.value = value; }
    else { display.value += value; }
}

function clearDisplay() {
    display.value = "0";
    previousDisplay.textContent = "Ready";
}

function deleteLast() {
    if (display.value.length > 1) { display.value = display.value.slice(0, -1); }
    else { display.value = "0"; }
}

function calculate() {
    try {
        let expression = display.value;
        if (expression === "" || expression === "0") { return; }
        expression = expression.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
        const result = Function('"use strict"; return (' + expression + ')')();
        if (!isFinite(result) || isNaN(result)) {
            display.value = "Error";
            previousDisplay.textContent = "Invalid calculation";
            return;
        }
        const finalResult = Number(result.toFixed(10));
        previousDisplay.textContent = display.value + " =";
        addToHistory(display.value, finalResult);
        display.value = finalResult;
    }
    catch (error) {
        display.value = "Error";
        previousDisplay.textContent = "Invalid expression";
    }
}

function addToHistory(expression, result) {
    const calculation = expression + " = " + result;
    calculationHistory.unshift(calculation);
    if (calculationHistory.length > 20) { calculationHistory.pop(); }
    localStorage.setItem("calculatorHistory", JSON.stringify(calculationHistory));
    displayHistory();
}

function displayHistory() {
    historyList.innerHTML = "";
    calculationCount.textContent = "Calculations: " + calculationHistory.length;
    if (calculationHistory.length === 0) {
        historyList.innerHTML = '<p class="empty-history">No calculations yet</p>';
        return;
    }
    calculationHistory.forEach(function (calculation) {
        const item = document.createElement("p");
        item.textContent = calculation;
        historyList.appendChild(item);
    });
}

clearHistoryButton.addEventListener("click", function () {
    calculationHistory = [];
    localStorage.removeItem("calculatorHistory");
    displayHistory();
});

copyResult.addEventListener("click", function () {
    if (display.value === "Error" || display.value === "0") { return; }
    navigator.clipboard.writeText(display.value);
    copyResult.textContent = "✓ Copied!";
    setTimeout(function () { copyResult.textContent = "📋 Copy"; }, 1200);
});

pasteResult.addEventListener("click", async function () {
    try {
        const copiedValue = await navigator.clipboard.readText();
        if (copiedValue.trim() === "") { return; }
        display.value = copiedValue.trim();
        previousDisplay.textContent = "Pasted";
    }
    catch (error) {
        previousDisplay.textContent = "Paste permission denied";
    }
});

themeToggle.addEventListener("click", function () {
    document.body.classList.toggle("dark");
    if (document.body.classList.contains("dark")) { themeToggle.textContent = "☀️"; }
    else { themeToggle.textContent = "🌙"; }
});

document.addEventListener("keydown", function (event) {
    const key = event.key;
    if ((key >= "0" && key <= "9") || key === "." || key === "+" || key === "-" || key === "*" || key === "/") {
        appendValue(key);
    }
    else if (key === "Enter") { event.preventDefault(); calculate(); }
    else if (key === "Backspace") { event.preventDefault(); deleteLast(); }
    else if (key === "Escape") { clearDisplay(); }
    else if (key === "%") { appendValue("%"); }
});

displayHistory();

const scientificToggle = document.getElementById("scientificToggle");
const scientificButtons = document.getElementById("scientificButtons");
const scientificOperations = document.querySelectorAll("[data-scientific]");

scientificToggle.addEventListener("click", function () {
    scientificButtons.classList.toggle("hidden");
    if (scientificButtons.classList.contains("hidden")) { scientificToggle.textContent = "Scientific Mode"; }
    else { scientificToggle.textContent = "Basic Mode"; }
});

scientificOperations.forEach(function (button) {
    button.addEventListener("click", function () {
        const operation = button.dataset.scientific;
        const value = Number(display.value);
        let result;
        if (display.value === "Error") { return; }
        if (operation === "sqrt") {
            if (value < 0) { display.value = "Error"; return; }
            result = Math.sqrt(value);
        }
        else if (operation === "square") { result = value * value; }
        else if (operation === "reciprocal") {
            if (value === 0) { display.value = "Error"; return; }
            result = 1 / value;
        }
        else if (operation === "sign") { result = value * -1; }
        else if (operation === "pi") { result = Math.PI; }
        else if (operation === "sin") { result = Math.sin(value * Math.PI / 180); }
        else if (operation === "cos") { result = Math.cos(value * Math.PI / 180); }
        else if (operation === "tan") { result = Math.tan(value * Math.PI / 180); }

        if (isFinite(result)) {
            previousDisplay.textContent = operation + "(" + value + ") =";
            addToHistory(operation + "(" + value + ")", Number(result.toFixed(10)));
            display.value = Number(result.toFixed(10));
        } else {
            display.value = "Error";
        }
    });
});
    </script>

</body>
</html>
